name: bel_sekolah_otomatis
description: "Aplikasi Bel Sekolah Otomatis - memutar suara bel sesuai jadwal, berjalan di background."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State Management: Riverpod ---
  # Dipilih Riverpod (bukan Provider) karena: compile-safe, testable,
  # mendukung auto-dispose & async (FutureProvider/StreamProvider) untuk
  # countdown bel berikutnya, tanpa BuildContext dependency.
  flutter_riverpod: ^2.6.1

  # --- Local Storage ---
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.5.3

  # --- Audio ---
  audioplayers: ^6.1.0

  # --- Alarm / Background / Notifikasi ---
  android_alarm_manager_plus: ^4.0.3
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.1
  permission_handler: ^12.0.0

  # --- Util ---
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
